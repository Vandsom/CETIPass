    }

    .transition-modal { transition: opacity 0.3s ease, transform 0.3s ease; }
    
    .cracha-cr80 {
      width: 86mm !important; height: 54mm !important;
      min-width: 86mm !important; max-width: 86mm !important;

      page-break-inside: avoid;
    }
    .card-shadow { box-shadow: 0 10px 25px rgba(2, 6, 23, 0.08); }

    .loading-spinner {
      border: 2px solid #f3f3f3;
      border-top: 2px solid #4f46e5;
      border-radius: 50%;
      width: 16px; height: 16px;
      animation: spin 1s linear infinite;
    }
    .nav-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.5rem 1.25rem;
      border-radius: 10rem;
      color: #fff !important;
      text-transform: uppercase;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1rem;
      transition: all 0.3s;
      position: relative;
      overflow: hidden;
      z-index: 1;
      text-decoration: none;
      text-align: center;
      min-width: 110px;
    }
    .nav-button:after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: #1e5aa0;
      z-index: -2;
    }
    .nav-button:before {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0%;
      height: 100%;
      background-color: #f9b000;
      transition: all 0.3s;
      z-index: -1;
    }
    .nav-button:hover:before {
      width: 100%;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>

      <!-- Título Móvel (Apenas celular) -->

      <!-- Formulário de Cadastro -->

            <svg class="w-6 h-6 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"/></svg>

          <h2 class="text-xl font-bold text-gray-800 dark:text-white">Novo Cadastro</h2>
        </div>
        
        <form id="formAluno" class="space-y-6" onsubmit="return false;">
          <!-- Nome Completo -->
          <div class="space-y-1">
            <label class="text-sm font-semibold text-gray-700 dark:text-slate-300">Nome do Aluno</label>
            <input id="nome" type="text" required oninput="this.value = this.value.toUpperCase()" class="w-full rounded-xl border-gray-200 dark:border-slate-700 bg-gray-50/50 dark:bg-slate-800/50 p-4 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none border transition-all uppercase text-sm text-black dark:text-black" placeholder="DIGITE O NOME COMPLETO">
            <p id="nomeWarning" class="text-xs text-red-500 mt-1 hidden font-medium">⚠️ Nome já consta na base de dados.</p>
          </div>

          <!-- Grid Curso e Turma -->
          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="space-y-1">
              <label class="text-sm font-semibold text-gray-700 dark:text-slate-300">Curso</label>
              <select id="curso" required class="w-full rounded-xl border-gray-200 dark:border-slate-700 bg-gray-50/50 dark:bg-slate-800/50 p-4 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none border transition-all text-sm">
                <option value="">Selecione...</option>
              </select>
            </div>
            <div class="space-y-1">
              <label class="text-sm font-semibold text-gray-700 dark:text-slate-300">Turma</label>
              <select id="turma" required class="w-full rounded-xl border-gray-200 dark:border-slate-700 bg-gray-50/50 dark:bg-slate-800/50 p-4 focus:bg-white focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 outline-none border transition-all text-sm">
                <option value="">Selecione...</option>
              </select>
            </div>
          </div>

          <!-- Matrícula -->
          <div class="space-y-1">
            <label class="text-sm font-semibold text-gray-700 dark:text-slate-300">Matrícula de Identificação</label>
            <div class="flex gap-2">
              <input id="matricula" type="text" readonly class="flex-1 rounded-xl border-gray-200 dark:border-slate-700 bg-gray-100 dark:bg-slate-800 p-4 font-mono font-bold text-gray-600 dark:text-slate-400 border text-sm" placeholder="0000000">
              <button id="refreshIdBtn" type="button" title="Gerar outro ID" class="p-4 bg-gray-100 dark:bg-slate-800 text-gray-500 hover:bg-gray-200 dark:hover:bg-slate-700 rounded-xl transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
              </button>
            </div>
          </div>

          <!-- Ações do Formulário -->
          <div class="flex flex-col-reverse sm:flex-row items-center justify-between pt-6 border-t border-gray-100 dark:border-slate-700 gap-4">
            <button id="limparBtn" type="button" class="text-gray-400 font-bold hover:text-gray-600 dark:hover:text-gray-300 transition-colors uppercase text-xs tracking-widest">Limpar</button>
            <button id="gerarBtn" class="w-full sm:w-auto bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-4 px-8 rounded-xl shadow-lg shadow-indigo-100 transition-all flex items-center justify-center gap-2">
              <span>Cadastrar Aluno</span>
            </button>
          </div>
        </form>
      </section>
    </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
    import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, limit, updateDoc, onSnapshot, deleteDoc, deleteField, arrayRemove, arrayUnion, serverTimestamp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

    // Configuração do Firebase (Preencha com suas chaves)
    const firebaseConfig = {
      apiKey: "AIzaSyB1wMxVNTcvIyz80arV4YNsKhUZAs7a4Uc",
      authDomain: "sistema-merenda.firebaseapp.com",
      projectId: "sistema-merenda",
      storageBucket: "sistema-merenda.firebasestorage.app",
      messagingSenderId: "1051054133501",
      appId: "1:1051054133501:web:83b869d971cc59a403ee94"
    };

    // Inicializar Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const form = document.getElementById('formAluno');
    const nomeInput = document.getElementById('nome');
    const nomeWarning = document.getElementById('nomeWarning');
    const matriculaInput = document.getElementById('matricula');
    const cursoSelect = document.getElementById('curso');
    const turmaSelect = document.getElementById('turma');
    const gerarBtn = document.getElementById('gerarBtn');
    const limparBtn = document.getElementById('limparBtn');
    const cursoParaTurma = document.getElementById('cursoParaTurma');
    const novoCursoNome = document.getElementById('novoCursoNome');
    const novaTurmaNome = document.getElementById('novaTurmaNome');

    // Lógica do Modal
    const configModal = document.getElementById('configModal');
    const openConfigBtn = document.getElementById('openConfigBtn');
    const closeConfigBtn = document.getElementById('closeConfigBtn');
    const logoutBtn = document.getElementById('logoutBtn');
    const themeToggle = document.getElementById('themeToggle');

    // Função para exibir toasts de notificação
    function showToast(message, type = 'info', duration = 3000) {
      const toastContainer = document.getElementById('toast-container');
      if (!toastContainer) {
        console.error('Toast container not found!');
        return;
      }

      const toast = document.createElement('div');
      toast.className = 'relative flex items-center justify-between w-full max-w-xs p-4 text-gray-900 bg-white rounded-lg shadow dark:text-gray-400 dark:bg-gray-800';

      let icon = '';
      let bgColor = '';
      let textColor = '';

      switch (type) {
        case 'success':
          icon = `<svg class="w-5 h-5 text-green-500 dark:text-green-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 8.207-4 4a1 1 0 0 1-1.414 0l-2-2a1 1 0 0 1 1.414-1.414L9 10.586l3.293-3.293a1 1 0 0 1 1.414 1.414Z"/></svg>`;
          bgColor = 'bg-green-100 dark:bg-green-900';
          textColor = 'text-green-800 dark:text-green-300';
          break;
        case 'error':
          icon = `<svg class="w-5 h-5 text-red-500 dark:text-red-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5Zm3.707 11.793a1 1 0 1 1-1.414 1.414L10 11.414l-2.293 2.293a1 1 0 0 1-1.414-1.414L8.586 10 6.293 7.707a1 1 0 0 1 1.414-1.414L10 8.586l2.293-2.293a1 1 0 0 1 1.414 1.414L11.414 10l2.293 2.293Z"/></svg>`;
          bgColor = 'bg-red-100 dark:bg-red-900';
          textColor = 'text-red-800 dark:text-red-300';
          break;
        case 'info':
        default:
          icon = `<svg class="w-5 h-5 text-blue-500 dark:text-blue-400" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 20 20"><path d="M10 .5a9.5 9.5 0 1 0 9.5 9.5A9.51 9.51 0 0 0 10 .5ZM10 15a1 1 0 1 1 0-2 1 1 0 0 1 0 2Zm1-4a1 1 0 0 1-2 0V6a1 1 0 0 1 2 0v5Z"/></svg>`;
          bgColor = 'bg-blue-100 dark:bg-blue-900';
          textColor = 'text-blue-800 dark:text-blue-300';
          break;
      }

      toast.innerHTML = `
        <div class="inline-flex items-center justify-center flex-shrink-0 w-8 h-8 ${bgColor} rounded-lg">
          ${icon}
          <span class="sr-only">${type} icon</span>
        </div>
        <div class="ms-3 text-sm font-normal ${textColor}">${message}</div>
        <button type="button" class="ms-auto -mx-1.5 -my-1.5 bg-white text-gray-400 hover:text-gray-900 rounded-lg focus:ring-2 focus:ring-gray-300 p-1.5 hover:bg-gray-100 inline-flex items-center justify-center h-8 w-8 dark:text-gray-500 dark:hover:text-white dark:bg-gray-800 dark:hover:bg-gray-700" data-dismiss-target="#toast-success" aria-label="Close">
            <span class="sr-only">Close</span>
            <svg class="w-3 h-3" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 14 14"><path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m1 1 6 6m0 0 6 6M7 7l6-6M7 7l-6 6"/></svg>
        </button>
      `;

      toastContainer.appendChild(toast);

      setTimeout(() => {
        toast.remove();
      }, duration);

      toast.querySelector('button').addEventListener('click', () => {
        toast.remove();
      });
    }

    const toggleModal = (show) => {
      if(show) {
        configModal.classList.remove('hidden', 'opacity-0');
        configModal.classList.add('flex', 'opacity-100');
        document.body.classList.add('modal-open');
      } else {
        configModal.classList.add('hidden', 'opacity-0');
        configModal.classList.remove('flex', 'opacity-100');
        document.body.classList.remove('modal-open');
      }
    };

    openConfigBtn.addEventListener('click', (event) => {
      event.preventDefault();
      toggleModal(true);
    });
    closeConfigBtn.onclick = () => toggleModal(false);

    // Lógica de Alternar Tema
    themeToggle.addEventListener('click', () => {
      if (document.documentElement.classList.contains('dark')) {
        document.documentElement.classList.remove('dark');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.classList.add('dark');
        localStorage.setItem('theme', 'dark');
      }
    });

    // Proteção de rota e Logout
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = 'login.html'; return; }
      
      const userDoc = await getDoc(doc(db, "usuarios", user.uid));
      if (!userDoc.exists() || userDoc.data().status !== 'aprovado') { 
        window.location.href = 'login.html'; 
        return;
      }
      
      // Exibir nome do usuário
      document.getElementById('userNameDisplay').textContent = userDoc.data().nome || user.email;
      
      // Iniciar contador de solicitações pendentes
      const qPendentes = query(collection(db, "usuarios"), where("status", "==", "pendente"));
      onSnapshot(qPendentes, (snap) => {
        const badge = document.getElementById('badgeSolicitacoes');
        badge.textContent = snap.size;
        badge.classList.toggle('hidden', snap.size === 0);
      });
    });
    window.toggleAccessView = () => {
      const accessSection = document.getElementById('accessManagementSection');
      const formSection = document.querySelector('form#formAluno').closest('section');
      const navCadastrar = document.getElementById('navCadastrar');
      const navSolicitacoes = document.getElementById('navSolicitacoes');

      const activeClasses = ['bg-indigo-600', 'text-white', 'shadow-lg', 'shadow-indigo-100'];
      const inactiveClasses = ['text-indigo-100', 'hover:bg-indigo-800', 'hover:text-white'];

      const isOpeningAccess = accessSection.classList.contains('hidden');

      accessSection.classList.toggle('hidden');
      formSection.classList.toggle('hidden');

      if (isOpeningAccess) {
        navSolicitacoes.classList.add(...activeClasses);
        navSolicitacoes.classList.remove(...inactiveClasses);
        navCadastrar.classList.remove(...activeClasses);
        navCadastrar.classList.add(...inactiveClasses);
        carregarPendentes();
      } else {
        navSolicitacoes.classList.remove(...activeClasses);
        navSolicitacoes.classList.add(...inactiveClasses);
        navCadastrar.classList.add(...activeClasses);
        navCadastrar.classList.remove(...inactiveClasses);
      }
    };

    function carregarPendentes() {
      const q = query(collection(db, "usuarios"), where("status", "==", "pendente"));
      onSnapshot(q, (snapshot) => {
        const tbody = document.getElementById('listaPendentes');
        tbody.innerHTML = '';
        snapshot.forEach(userDoc => {
          const u = userDoc.data();
          const tr = document.createElement('tr');
          tr.innerHTML = `
            <td class="px-6 py-4 font-medium">${u.nome}</td>
            <td class="px-6 py-4 text-sm">${u.email}</td>
            <td class="px-6 py-4 text-right flex justify-end gap-2">
              <button onclick="decidirAcesso('${userDoc.id}', 'aprovado')" class="bg-emerald-500 text-white px-3 py-1 rounded-lg text-xs font-bold">Aprovar</button>
              <button onclick="decidirAcesso('${userDoc.id}', 'rejeitado')" class="bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold">Rejeitar</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      });
    }

    window.decidirAcesso = async (uid, status) => {
      try {
        await updateDoc(doc(db, "usuarios", uid), { status });
        showToast(`Usuário ${status}!`, 'success');
      } catch (err) {
        showToast("Erro na ação.", 'error');
      }
    };
    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
    });

    let cursosComTurmas = {};

    // Verificação de nome em tempo real com debounce
    let debounceTimer;
    nomeInput.addEventListener('input', () => {
      clearTimeout(debounceTimer);
      const nome = nomeInput.value.trim();
      nomeWarning.classList.add('hidden');

      if (nome.length < 3) return;

      debounceTimer = setTimeout(async () => {
        try {
          const q = query(
            collection(db, "alunos"), 
            where("nome", "==", nome), 
            limit(1)
          );
          const snap = await getDocs(q);
          if (!snap.empty) {
            nomeWarning.classList.remove('hidden');
 showToast('Nome já consta na base de dados.', 'info', 5000);
          }
        } catch (e) {
          console.error("Erro ao verificar nome:", e);
        }
      }, 600); // Aguarda 600ms após a última tecla
    });

    // --- Gestão de Configurações (Cursos/Turmas) ---
    const configDocRef = doc(db, "configuracoes", "dadosBase");

    function setupConfigSync() {
      onSnapshot(configDocRef, async (docSnap) => {
        if (docSnap.exists()) {
          const data = docSnap.data();
          cursosComTurmas = data.cursosComTurmas || {};

          if (!data.cursosComTurmas) {
            const oldCourses = Array.isArray(data.cursos) ? data.cursos : [];
            oldCourses.forEach(curso => {
              if (!cursosComTurmas[curso]) cursosComTurmas[curso] = [];
            });

            if (oldCourses.length) {
              await setDoc(configDocRef, { cursosComTurmas }, { merge: true });
            }
          }

          const cursos = Object.keys(cursosComTurmas).sort((a, b) => a.localeCompare(b, 'pt-BR'));
          populateCourseSelect(cursoSelect, cursos, "Selecione um curso");
          populateCourseSelect(cursoParaTurma, cursos, "Selecione o Curso...");
          handleCursoSelectChange();
          renderConfigList();
        } else {
          await setDoc(configDocRef, { cursosComTurmas: {} });
        }
      });
    }

    async function renderConfigList() {
      const listContainer = document.getElementById('configList');
      listContainer.innerHTML = '';

      // Buscar contagem de alunos por curso no Firestore
      const studentCounts = {};
      try {
        const snapshotAlunos = await getDocs(collection(db, "alunos"));
        snapshotAlunos.forEach(doc => {
          const data = doc.data();
          if (data.curso) {
            studentCounts[data.curso] = (studentCounts[data.curso] || 0) + 1;
          }
        });
      } catch (e) { console.error("Erro ao contar alunos:", e); }

      Object.keys(cursosComTurmas).sort().forEach(curso => {
        const count = studentCounts[curso] || 0;
        const cursoDiv = document.createElement('div');
        cursoDiv.className = "bg-gray-50 dark:bg-slate-800/50 p-4 rounded-2xl border dark:border-slate-800";
        
        const turmas = cursosComTurmas[curso] || [];
        
        cursoDiv.innerHTML = `
          <div class="flex items-center justify-between mb-3">
            <div class="flex items-center gap-2">
              <span class="font-black text-indigo-600 dark:text-indigo-400 uppercase text-sm">${curso}</span>
              <span class="px-2 py-0.5 bg-indigo-100 dark:bg-indigo-900/40 text-indigo-700 dark:text-indigo-300 text-[10px] rounded-full font-bold">
                ${count} alunos
              </span>
            </div>
            <div class="flex gap-2">
              <button onclick="window.editConfig('curso', '${curso}')" class="p-1.5 text-gray-400 hover:text-amber-500 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button onclick="window.removeConfig('curso', '${curso}')" class="p-1.5 text-gray-400 hover:text-red-500 transition-colors">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div class="flex flex-wrap gap-2">
            ${turmas.map(turma => `
              <div class="flex items-center gap-1 bg-white dark:bg-slate-700 px-3 py-1.5 rounded-lg border dark:border-slate-600 text-[10px] font-bold">
                <span class="text-gray-700 dark:text-gray-200">${turma}</span>
                <button onclick="window.editConfig('turma', '${curso}', '${turma}')" class="ml-1 text-gray-400 hover:text-amber-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" stroke-width="2"/></svg></button>
                <button onclick="window.removeConfig('turma', '${curso}', '${turma}')" class="text-gray-400 hover:text-red-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-width="2"/></svg></button>
              </div>
            `).join('')}
          </div>
        `;
        listContainer.appendChild(cursoDiv);
      });
    }

    function populateCourseSelect(selectEl, cursos, placeholder) {
      selectEl.innerHTML = `<option value="">${placeholder}</option>`;
      cursos.forEach(curso => {
        const opt = document.createElement('option');
        opt.value = curso;
        opt.textContent = curso;
        selectEl.appendChild(opt);
      });
    }

    function populateTurmaSelect(selectEl, turmas, placeholder, disabled = false) {
      selectEl.innerHTML = `<option value="">${placeholder}</option>`;
      turmas.forEach(turma => {
        const opt = document.createElement('option');
        opt.value = turma;
        opt.textContent = turma;
        selectEl.appendChild(opt);
      });
      selectEl.disabled = disabled;
    }



    window.removeConfig = async (type, curso, turma) => {
      if (type === 'curso') {
        // Verificar se há alunos matriculados no curso
        const q = query(collection(db, "alunos"), where("curso", "==", curso), limit(1));
        const snapshot = await getDocs(q);
        
        if (!snapshot.empty) {
          showToast(`Não é possível excluir o curso "${curso}" porque existem alunos matriculados nele.`, 'error');
          return;
        }

        if (!confirm(`Excluir o curso "${curso}" e todas as suas turmas?`)) return;
        await updateDoc(configDocRef, { [`cursosComTurmas.${curso}`]: deleteField() });
        showToast('Curso removido com sucesso!', 'success');
      } else if (type === 'turma') {
        // Verificar se há alunos matriculados na turma
        const q = query(
          collection(db, "alunos"), 
          where("curso", "==", curso), 
          where("turma", "==", turma), 
          limit(1)
        );
        const snapshot = await getDocs(q);

        if (!snapshot.empty) {
          showToast(`Não é possível excluir a turma "${turma}" porque existem alunos matriculados nela.`, 'error');
          return;
        }

        if (!confirm(`Excluir a turma "${turma}" do curso "${curso}"?`)) return;
        await updateDoc(configDocRef, { [`cursosComTurmas.${curso}`]: arrayRemove(turma) });
        showToast('Turma removida com sucesso!', 'success');
      }
    };

    document.getElementById('btnSalvarCurso').onclick = async () => {
      const val = novoCursoNome.value.trim().toUpperCase();
      if (!val) return;
      await updateDoc(configDocRef, { [`cursosComTurmas.${val}`]: [] });
      novoCursoNome.value = '';
      cursoParaTurma.value = val;
      showToast('Curso adicionado com sucesso!', 'success');
    };

    document.getElementById('btnSalvarTurma').onclick = async () => {
      const cursoSelecionado = cursoParaTurma.value;
      const val = novaTurmaNome.value.trim().toUpperCase();
      if (!cursoSelecionado) {
        showToast('Selecione um curso antes de adicionar a turma.', 'error');
        return;
      }
      if (!val) {
        showToast('Digite o nome da turma.', 'error');
        return;
      }
      await updateDoc(configDocRef, { [`cursosComTurmas.${cursoSelecionado}`]: arrayUnion(val) });
      novaTurmaNome.value = '';
      showToast('Turma adicionada com sucesso!', 'success');
    };

    function handleCursoSelectChange() {
      const curso = cursoSelect.value;
      if (!curso) {
        populateTurmaSelect(turmaSelect, [], "Selecione um curso primeiro", true);
        return;
      }
      const turmas = cursosComTurmas[curso] || [];
      populateTurmaSelect(turmaSelect, turmas, "Selecione uma turma", turmas.length === 0);
    }

    cursoSelect.addEventListener('change', handleCursoSelectChange);
    cursoParaTurma.addEventListener('change', () => {
      novaTurmaNome.disabled = !cursoParaTurma.value;
      document.getElementById('btnSalvarTurma').disabled = !cursoParaTurma.value;
      if (cursoParaTurma.value) novaTurmaNome.focus();
    });

    // Gera matrícula aleatória de 7 dígitos
    function generateMatricula() {
      return Math.floor(1000000 + Math.random() * 9000000).toString();
    }

    // Inicializa matrícula no load
    window.addEventListener('DOMContentLoaded', () => {
      matriculaInput.value = generateMatricula();
      setupConfigSync();
      if (location.hash === '#config') {
        toggleModal(true);
      }
    });

    // Função para salvar no Firestore
    async function salvarNoFirestore(nome, matricula, curso, turma) {
      try {
        // Usando a matrícula como ID do documento
        await setDoc(doc(db, "alunos", matricula), {
          nome: nome.toUpperCase(),
          matricula: matricula,
          curso: curso.toUpperCase(),
          turma: turma.toUpperCase(),
          status: 'ativo',
          dataCadastro: serverTimestamp()
        });
        showToast('Aluno cadastrado com sucesso!', 'success');
        console.log("Aluno cadastrado no Firestore com sucesso!");
        return true;
      } catch (error) {
        console.error("Erro ao salvar no Firestore:", error);
        showToast('Erro ao salvar no banco de dados.', 'error');
        return false;
      }
    }

    gerarBtn.addEventListener('click', async (e) => {
      e.preventDefault();
      const nome = nomeInput.value.trim();
      const curso = cursoSelect.value;
      const turma = turmaSelect.value;
      const matricula = matriculaInput.value;
      
      if (!nome || !curso || !turma) {
        showToast('Preencha todos os campos.', 'info');
        return;
      }

      const originalText = gerarBtn.textContent;
      gerarBtn.disabled = true;
      gerarBtn.textContent = "Salvando...";
      
      const salvo = await salvarNoFirestore(nome, matricula, curso, turma);
      
      if (salvo) {
        // Prepara para um novo cadastro
        nomeInput.value = '';
        cursoSelect.value = '';
        turmaSelect.value = '';
        matriculaInput.value = generateMatricula();
      }

      gerarBtn.disabled = false;
      gerarBtn.textContent = originalText;
    });

    limparBtn.addEventListener('click', () => {
      form.reset();
      nomeWarning.classList.add('hidden');
      matriculaInput.value = generateMatricula();
    });
  </script>
  <div id="toast-container" class="fixed top-4 right-4 z-[9999] space-y-2"></div>

  <!-- Modal de Configurações do Sistema - POSICIONAMENTO CORRETO -->
  <div id="configModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden items-center justify-center z-[100] transition-modal opacity-0">
    <div class="bg-white dark:bg-slate-900 rounded-3xl shadow-2xl w-full max-w-3xl max-h-[90vh] overflow-y-auto m-4 flex flex-col gap-6 p-8 border dark:border-slate-800">
      
      <div class="flex justify-between items-center border-b dark:border-slate-800 pb-4 sticky top-0 bg-white dark:bg-slate-900 z-10">
        <h2 class="text-2xl font-black text-gray-900 dark:text-white uppercase tracking-tighter">Gerenciar Cursos e Turmas</h2>
        <button id="closeConfigBtn" class="text-gray-400 hover:text-red-500 transition-colors p-2 rounded-full hover:bg-gray-100 dark:hover:bg-slate-800">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
      </div>

      <div class="flex flex-col gap-8">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <!-- Card Adicionar Curso -->
          <div class="bg-indigo-50 dark:bg-indigo-950/20 p-6 rounded-2xl border border-indigo-100 dark:border-indigo-900/30 flex flex-col gap-4">
            <label class="text-xs font-black text-indigo-800 dark:text-indigo-400 uppercase tracking-widest">1. Novo Curso</label>
            <input type="text" id="novoCursoNome" placeholder="EX: ENFERMAGEM" class="w-full p-4 rounded-xl border-none bg-white dark:bg-slate-800 shadow-sm focus:ring-4 focus:ring-indigo-500/20 outline-none uppercase text-sm font-bold" oninput="this.value = this.value.toUpperCase()">
            <button id="btnSalvarCurso" class="bg-indigo-600 hover:bg-indigo-700 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-indigo-200 dark:shadow-none text-sm uppercase">
              + Adicionar Curso
            </button>
          </div>

          <!-- Card Adicionar Turma -->
          <div class="bg-emerald-50 dark:bg-emerald-950/20 p-6 rounded-2xl border border-emerald-100 dark:border-emerald-900/30 flex flex-col gap-4">
            <label class="text-xs font-black text-emerald-800 dark:text-emerald-400 uppercase tracking-widest">2. Nova Turma</label>
            <select id="cursoParaTurma" class="w-full p-4 rounded-xl border-none bg-white dark:bg-slate-800 shadow-sm focus:ring-4 focus:ring-emerald-500/20 outline-none text-sm font-bold">
              <option value="">SELECIONE O CURSO...</option>
            </select>
            <input type="text" id="novaTurmaNome" placeholder="EX: 1ª SÉRIE A" class="w-full p-4 rounded-xl border-none bg-white dark:bg-slate-800 shadow-sm focus:ring-4 focus:ring-emerald-500/20 outline-none uppercase text-sm font-bold disabled:opacity-50" disabled oninput="this.value = this.value.toUpperCase()">
            <button id="btnSalvarTurma" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black py-4 rounded-xl transition-all shadow-lg shadow-emerald-200 dark:shadow-none text-sm uppercase disabled:opacity-50" disabled>
              + Adicionar Turma
            </button>
          </div>
        </div>
      </div>

      <!-- Lista de Gerenciamento Excluir/Editar -->
      <div class="border-t dark:border-slate-800 pt-6">
        <h3 class="text-lg font-bold text-gray-800 dark:text-white mb-4 uppercase tracking-tight">Cursos e Turmas Cadastrados</h3>
        <div id="configList" class="space-y-4 max-h-64 overflow-y-auto pr-2 custom-scrollbar"></div>
      </div>
    </div>
  </div>
</body>
</html>
